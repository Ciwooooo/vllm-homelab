apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate # only one pod can hold the gpu, cant do rolling updates
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false # disable legacy env var injection
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.28.0
        command: ["vllm", "serve"]
        args:
          - "Qwen/Qwen3-4B-AWQ"
          - "--quantization=awq"
          - "--host=0.0.0.0"
          - "--port=8000"
          - "--dtype=float16" # set explicitly
          - "--max-model-len=2048"
          - "--gpu-memory-utilization=0.92"
          - "--enforce-eager" # disable graph capture, slower but less vram
        ports:
          - containerPort: 8000
            name: http
        resources:
          limits:
            cpu: 4
            memory: 10Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: model-cache # local reference name
          mountPath: /root/.cache/huggingface
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30 # how long to wait before first probe
          periodSeconds: 10 # how often to repeat
          failureThreshold: 30 # how many times it can fail before considered unhealthy
      volumes:
      - name: model-cache # local reference name
        persistentVolumeClaim:
          claimName: vllm-cache-pvc # actual storage source
